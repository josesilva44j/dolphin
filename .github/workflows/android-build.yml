name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Baixar o codigo (com submodulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK (debug, so arm64)
        working-directory: Source/Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon --console=plain

      - name: Procurar onde o APK foi parar
        if: always()
        run: |
          echo "=== APKs encontrados ==="
          find . -name "*.apk" -not -path "*/node_modules/*" | head -50
          echo "=== Conteudo de outputs ==="
          ls -R Source/Android/app/build/outputs 2>/dev/null | head -80

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-mali-apk
          path: Source/Android/app/build/intermediates/apk/debug/app-debug.apk
          if-no-files-found: error
