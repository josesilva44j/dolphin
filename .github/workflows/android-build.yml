name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Baixar o codigo (com submodulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK (debug, so arm64)
        working-directory: Source/Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon --console=plain

      - name: Alinhar e assinar o APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=Source/Android/app/build/intermediates/apk/debug/app-debug.apk
          echo "=== Verificacao do APK original ==="
          "$BT/apksigner" verify --verbose "$IN" || true
          "$BT/zipalign" -p -f 4 "$IN" /tmp/aligned.apk
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Dolphin Mali Teste"
          mkdir -p out
          "$BT/apksigner" sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --out out/dolphin-mali.apk /tmp/aligned.apk
          echo "=== Verificacao do APK final ==="
          "$BT/apksigner" verify --verbose out/dolphin-mali.apk

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-mali-apk
          path: out/dolphin-mali.apk
          if-no-files-found: error
